name: Yama güncelle

on:
  schedule:
    - cron: '23 */3 * * *' # her 3 saatte bir
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Toplam kaç yamanın kayıtlı olması istenir (ilk kurulumda 5 yaz, sonra 0)'
        required: false
        default: '0'
      patch:
        description: 'Belirli bir yamayı zorla yeniden işle, örn. 26.22 (genelde boş bırak)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: yama-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yamaları kontrol et ve işle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          PATCH: ${{ github.event.inputs.patch }}
        run: |
          ARGS=""
          if [ -n "$BACKFILL" ] && [ "$BACKFILL" != "0" ]; then ARGS="$ARGS --backfill $BACKFILL"; fi
          if [ -n "$PATCH" ]; then ARGS="$ARGS --patch $PATCH"; fi
          node scripts/update.mjs $ARGS
      - name: Değişiklikleri kaydet
        if: always()
        run: |
          git config user.name "yama-bot"
          git config user.email "yama-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok"
          else
            git commit -m "Yama verisi güncellendi"
            git push
          fi
